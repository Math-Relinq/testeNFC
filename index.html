<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        button{
            margin: 70px;
            scale: 2;
        }

        #nfcField{
            color: white;
            margin: 0 auto;
            font-family: Arial, Helvetica, sans-serif;
            scale: 1.3;
        }

    </style>

</head>
<body>
    <div id="nfc">

    </div>

    <button onclick="nfcReader()"></button>

    <script>

        async function nfcReader() {
            let nfcField = document.getElementById('nfc')
            
            try {
                const ndef = new NDEFReader()
                await ndef.scan()

                ndef.onreading = event => {
                    const id = event.serialNumber

                    switch (String(id)) {
                        case '04:39:fa:62:ce:2a:81':
                            nfcField.innerText = 'Matheus'
                            document.body.style.backgroundColor = 'blue'
                            break;
                        case '04:45:93:60:ce:2a:81':
                            nfcField.innerText = 'Fabio'
                            document.body.style.backgroundColor = 'red'
                            break
                        case '04:39:f1:60:ce:2a:81':
                            nfcField.innerText = 'Casa'
                            document.body.style.backgroundColor = 'green'
                            break
                        default:
                            break;
                    }
                }
            } catch (error) {
                nfcField.innerText = 'Erro: ' + error
            }
        }
    </script>
</body>
</html>
